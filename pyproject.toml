[project]
name = "workflow-engine"
version = "0.1.0"
description = "A lightweight workflow engine for building data-processing pipelines."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.2",
]

[project.optional-dependencies]
data = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
workflow-engine = "workflow_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
