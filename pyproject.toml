[project]
name = "workflow-engine"
version = "0.1.0"
description = "A lightweight workflow engine for building data-processing pipelines."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.1",
]

[project.optional-dependencies]
data = [
    "numpy>=1.26",
    "polars>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pyright>=1.1",
    "ruff>=0.3",
]

[project.scripts]
workflow-engine = "workflow_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".artifacts/.pytest_cache"

[tool.coverage.run]
data_file = ".artifacts/.coverage"

[tool.ruff]
cache-dir = ".artifacts/.ruff_cache"
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.14"
typeCheckingMode = "standard"